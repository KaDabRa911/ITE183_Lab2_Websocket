<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .error-card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .code {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ef4444;
      margin: 0 0 8px 0;
      line-height: 1;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 10px 0;
      color: #0f172a;
    }

    p {
      color: #64748b;
      font-size: 0.95rem;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      padding: 10px 20px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    a:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The requested resource could not be found on this server.</p>
    <a href="/">Back to Chat Client</a>
  </div>
</body>
</html>
