<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSL WebSocket Test Client</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-card {
      background: #ffffff;
      width: 100%;
      max-width: 560px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
      border: 1px solid #e2e8f0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    #status {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      background-color: #e2e8f0;
      color: #475569;
      transition: all 0.2s ease;
    }

    #log {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      height: 300px;
      overflow-y: auto;
      padding: 14px;
      background-color: #f8fafc;
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #log div {
      padding: 6px 10px;
      border-radius: 6px;
      word-wrap: break-word;
    }

    .sent {
      background-color: #dbeafe;
      color: #1e40af;
      align-self: flex-end;
      max-width: 85%;
    }

    .received {
      background-color: #dcfce7;
      color: #166534;
      align-self: flex-start;
      max-width: 85%;
    }

    .system {
      color: #64748b;
      font-style: italic;
      font-size: 0.82rem;
      text-align: center;
      background: transparent;
    }

    #controls {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex-grow: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    input[type="text"]:disabled {
      background-color: #f1f5f9;
      cursor: not-allowed;
    }

    button {
      padding: 10px 20px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="header">
      <h2>BSL WebSocket Client</h2>
    </div>

    <div id="status">Status: Connecting...</div>

    <div id="log"></div>

    <div id="controls">
      <input type="text" id="msgInput" placeholder="Type a message..." disabled />
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <script>
    const wsUrl = "ws://localhost:8000";
    const socket = new WebSocket(wsUrl);

    const statusDiv = document.getElementById("status");
    const logDiv = document.getElementById("log");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    function appendLog(text, className) {
      const entry = document.createElement("div");
      entry.className = className;
      entry.textContent = text;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    socket.onopen = function() {
      statusDiv.textContent = "Status: Connected to " + wsUrl;
      statusDiv.style.backgroundColor = "#dcfce7";
      statusDiv.style.color = "#166534";
      msgInput.disabled = false;
      sendBtn.disabled = false;
      appendLog("[System] Handshake complete. WebSocket ready.", "system");
    };

    socket.onmessage = function(event) {
      appendLog("[Server] " + event.data, "received");
    };

    socket.onclose = function(event) {
      statusDiv.textContent = "Status: Disconnected";
      statusDiv.style.backgroundColor = "#fee2e2";
      statusDiv.style.color = "#991b1b";
      msgInput.disabled = true;
      sendBtn.disabled = true;
      appendLog("[System] Connection closed by server.", "system");
    };

    socket.onerror = function(error) {
      appendLog("[Error] WebSocket error occurred.", "system");
    };

    function sendMessage() {
      const text = msgInput.value.trim();
      if (text.length > 0 && socket.readyState === WebSocket.OPEN) {
        socket.send(text);
        appendLog("[Client] " + text, "sent");
        msgInput.value = "";
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    msgInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
